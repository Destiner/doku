name: Publish to npm
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run scripts/build-npm.ts
        env:
          npm_package_version: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          registry-url: https://registry.npmjs.org

      - name: Publish platform packages then main package
        run: |
          for dir in npm/doku-app-darwin-arm64 npm/doku-app-darwin-x64 npm/doku-app-linux-x64 npm/doku-app-linux-arm64; do
            cd "$dir" && npm publish --access public || true && cd -
          done
          cd npm/doku-app && npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
