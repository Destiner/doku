name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Prettier
        run: bun run format:check

      - name: ESLint
        run: bun run lint:check

      - name: TypeScript
        run: bun run typecheck

      - name: Tests
        run: bun run test
